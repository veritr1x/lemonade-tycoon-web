name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Finish an active production deployment before starting the next one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned WebAssembly compiler
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Test the shared runtime
        run: python3 tools/test.py
      - name: Build and validate WebAssembly
        run: python3 tools/build.py --jobs 2
      # Pull requests build and test but cannot publish the production site.
      - name: Upload the static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
