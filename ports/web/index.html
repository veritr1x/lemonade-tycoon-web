<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#07140d" />
    <title>Lemonade Tycoon</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <strong>Lemonade Tycoon</strong>
      <nav>
        <button id="sound" aria-pressed="false">Sound on</button
        ><button id="fullscreen">Fullscreen</button>
      </nav>
    </header>
    <main id="stage">
      <canvas
        id="game"
        width="640"
        height="480"
        aria-label="Lemonade Tycoon game"
      ></canvas
      ><input
        id="keyboard"
        type="text"
        aria-label="Game text input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        hidden
      />
      <section id="cover">
        <h1>Lemonade Tycoon</h1>
        <p id="status" role="status">Loading the original game…</p>
        <button id="play" disabled>Play</button>
      </section>
    </main>
    <footer>
      <span id="save-status">Saves stay in this browser.</span
      ><a id="website" target="_blank" rel="noopener noreferrer" hidden
        >Open game website</a
      >
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
